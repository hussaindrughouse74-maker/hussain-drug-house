<style>

    --teal-900:#0B3D39;
    --teal-700:#0F5C56;
    --teal-500:#16847A;
    --mint-100:#F1F6F4;
    --amber-600:#B4690E;
    --amber-100:#FBEBD6;
    --red-700:#B3261E;
    --red-100:#FBE9E7;
    --ink-900:#1B2523;
    --ink-500:#5B6B67;

  body{

<script>
/* ===================== DATA LAYER ===================== */
const DB_KEY = 'hdh_pharmacy_db_v1';

function defaultDB(){
  return { stock:[], purchases:[], sales:[], purchaseReturns:[], saleReturns:[], parties:[], payments:[],
           expenses:[], auditLog:[], staff:[], staffLedger:[], shopInfo:{name:'Hussain Drug House', gstin:'18ADOPH1433M1ZB', dlNo:'', address:'2ND Gali Kazir Bazar, Ratabari - 788735', phone:''}, seqs:{} };
}
/* Fills in any collection a saved/restored file is missing. Without this, an
   older backup (or partial data) crashes the app the moment a screen does
   db.<missing>.filter(...). */
function normalizeDB(d){
  const base = defaultDB();
  Object.keys(base).forEach(k=>{
    if(d[k]===undefined || d[k]===null) d[k] = base[k];
  });
  return d;
}
function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ return normalizeDB(JSON.parse(raw)); }catch(e){} }
  return defaultDB();
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let db = loadDB();
if(!db.seqs) db.seqs = {}; // upgrade older saved data that used a single shared 'seq'
if(!db.parties) db.parties = [];
if(!db.payments) db.payments = [];

function nextId(prefix){
  if(!db.seqs[prefix]) db.seqs[prefix] = 1;
  const id = prefix + '-' + String(db.seqs[prefix]).padStart(4,'0');
  db.seqs[prefix] += 1;
  return id;
}
function formatBillNo(kind, n){
  const prefix = kind==='purchase' ? 'HDHP' : 'HDHS';
  return prefix + String(n).padStart(5,'0');
}
/* Separate sequences: HDHP-prefixed for purchases (and purchase returns),
   HDHS-prefixed for sales (and sale returns). Local mode: per-kind counter.
   Cloud mode: allocated inside a small Firestore transaction so two
   devices can never get the same number at the same time. */
function nextBillNoLocal(kind){
  const key = 'HDHNO_'+kind;
  if(!db.seqs[key]) db.seqs[key] = 1;
  const n = db.seqs[key];
  db.seqs[key] += 1;
  return formatBillNo(kind, n);
}
async function nextBillNoCloud(kind){
  const counterRef = fsDB.collection('meta').doc('billCounter_'+kind);
  return await fsDB.runTransaction(async (tx)=>{
    const snap = await tx.get(counterRef);
    const current = snap.exists ? (snap.data().seq||0) : 0;
    const next = current+1;
    tx.set(counterRef, {seq: next}, {merge:true});
    return formatBillNo(kind, next);
  });
}
async function nextBillNo(kind){
  return CLOUD_MODE ? await nextBillNoCloud(kind) : nextBillNoLocal(kind);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return '₹' + (Math.round(n*100)/100).toLocaleString('en-IN'); }
function daysUntil(dateStr){
  // Expiry is stored as "MM/YY" (the purchase form's format), but this also
  // accepts older "MM/YYYY" entries. Building a Date by string-concatenation
  // (the old approach) is unreliable across browsers/formats — it silently
  // misparsed correctly-formatted dates as Invalid Date, and misparsed
  // shorter "MM/YY" entries as the year 2001. This parses the two parts
  // by hand instead, so it works regardless of engine date-parsing quirks.
  if(!dateStr) return Infinity;
  const parts = String(dateStr).split('/');
  if(parts.length !== 2) return Infinity;
  let mm = parseInt(parts[0], 10);
  let yyyy = parseInt(parts[1], 10);
  if(!mm || !yyyy || mm<1 || mm>12) return Infinity;
  if(yyyy < 100) yyyy += 2000; // gracefully handle older 2-digit-year entries already saved
  const d = new Date(yyyy, mm, 0); // last day of that expiry month
  const diff = d - new Date();
  return Math.round(diff / (1000*60*60*24));
}

/* find or create stock row by item+batch */
function findStock(itemName, batch){
  return db.stock.find(s => s.itemName.trim().toLowerCase()===itemName.trim().toLowerCase() && s.batch.trim().toLowerCase()===batch.trim().toLowerCase());
}

/* ===================== CLOUD SYNC (FIREBASE) =====================
   Local mode (default): everything above — data lives only on this device.
   Cloud mode (once configured): same UI and functions, but reads/writes
   go to a shared Firestore database + Storage bucket, so every phone and
   computer signed in to the same Firebase project see the same live data.
*/
const FB_CONFIG_KEY = 'hdh_fb_config';
let CLOUD_MODE = false;
let fbApp=null, fsDB=null, fbStorage=null;

function slugId(itemName,batch){
  return (itemName+'_'+batch).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,120) || ('item_'+Date.now());
}

function getStoredConfig(){
  try{ return JSON.parse(localStorage.getItem(FB_CONFIG_KEY)); }catch(e){ return null; }
}

function openCloudModal(){
  const body = document.getElementById('cloudModalBody');
  const existing = getStoredConfig();
  document.querySelector('#cloudModal .modal-head h3').textContent = 'Connect cloud sync';
  body.innerHTML = `
    <div class="step">This connects the app to a <b>free Firebase project</b> (Google's cloud database) so stock, sales and purchases sync live across every phone and computer — no monthly fee for a single shop's volume.</div>
    <div class="step">
      <b>One-time setup (about 5 minutes):</b><br>
      1. Go to <b>console.firebase.google.com</b> → Add project (any name).<br>
      2. In the project, open <b>Build → Firestore Database</b> → Create database → Standard edition → start in <b>production mode</b>.<br>
      3. Open <b>Build → Authentication</b> → Sign-in method → enable <b>Anonymous</b>.<br>
      4. Go to Project settings (gear icon) → scroll to "Your apps" → click the <b>&lt;/&gt; web icon</b> → register app → copy the <b>firebaseConfig</b> object shown.<br>
      5. Paste that whole object below and tap Connect.<br>
      <i>Note: Storage is skipped on purpose — it now requires a billing account (Blaze plan). Bill photos are instead compressed and stored directly in Firestore, so no card is needed and everything stays on the free Spark plan.</i>
    </div>
    <div class="field"><label>Paste firebaseConfig here</label>
      <textarea class="config-input" id="fbConfigInput" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "...", "storageBucket": "...", "messagingSenderId": "...", "appId": "..." }'>${existing ? JSON.stringify(existing,null,2) : ''}</textarea>
    </div>
    <button class="btn btn-primary" onclick="connectCloud()">Connect</button>
    ${existing ? `<button class="btn btn-danger" style="margin-top:8px;" onclick="disconnectCloud()">Disconnect & go back to local only</button>` : ''}
    <div class="step" style="margin-top:10px;"><b>Setup order matters:</b><br>
      1. Authentication → Sign-in method → enable <b>Email/Password</b>.<br>
      2. Authentication → Users → Add user (your own email + password). Copy the <b>User UID</b>.<br>
      3. Firestore → Data → create collection <b>users</b> → Document ID = that UID → field <b>role</b> = <b>owner</b>.<br>
      4. Paste the rules below into Firestore → Rules → Publish.<br>
      <b>Skip step 3 and you'll be treated as staff and locked out of your own reports.</b>
    </div>
    <div class="step" style="margin-top:10px;"><b>Firestore rules — paste ALL of this</b> (Firestore → Rules → Publish):<br>
    <textarea class="config-input" readonly style="min-height:220px;font-size:10px;">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() { return request.auth != null; }
    function isOwner() {
      return signedIn() &&
        get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'owner';
    }

    // Counter staff need these to sell and check stock.
    match /stock/{doc}        { allow read, write: if signedIn(); }
    match /sales/{doc}        { allow read, create: if signedIn();
                                allow update, delete: if isOwner(); }
    match /saleReturns/{doc}  { allow read, create: if signedIn(); }
    match /parties/{doc}      { allow read, create: if signedIn();
                                allow update, delete: if isOwner(); }
    match /payments/{doc}     { allow read: if signedIn();
                                allow write: if isOwner(); }
    match /settings/{doc}     { allow read: if signedIn();
                                allow write: if isOwner(); }
    match /meta/{doc}         { allow read, write: if signedIn(); }
    match /expenses/{doc}     { allow read, update, delete: if isOwner();
                                allow create: if signedIn(); }

    // OWNER ONLY — purchase data reveals what you paid the distributor.
    match /purchases/{doc}       { allow read, write: if isOwner(); }
    match /purchaseReturns/{doc} { allow read, write: if isOwner(); }
    match /auditLog/{doc}        { allow read: if isOwner();
                                   allow create: if signedIn(); }
    match /staff/{doc}           { allow read, write: if isOwner(); }
    match /staffLedger/{doc}     { allow read, write: if isOwner(); }

    match /users/{uid} { allow read: if signedIn();
                         allow write: if isOwner(); }
  }
}</textarea></div>
  `;
  document.getElementById('cloudModal').style.display='flex';
}
function closeCloudModal(){ document.getElementById('cloudModal').style.display='none'; }

function connectCloud(){
  const raw = document.getElementById('fbConfigInput').value.trim();
  let cfg;
  try{ cfg = JSON.parse(raw); }
  catch(e){ alert('That doesn\'t look like valid JSON. Copy the exact firebaseConfig object from Firebase and paste it as-is.'); return; }
  if(!cfg.apiKey || !cfg.projectId){ alert('Missing apiKey or projectId — copy the full firebaseConfig object.'); return; }
  localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg));
  location.reload();
}
function disconnectCloud(){

function initCloudIfConfigured(){
  const cfg = getStoredConfig();
  if(!cfg) return false;
  try{
    fbApp = firebase.initializeApp(cfg);
    fsDB = firebase.firestore();
    // Offline persistence: keeps a full local copy on the device, so the app
    // keeps working (billing, purchases, returns) with zero internet. Anything
    // done offline queues up and syncs automatically the moment internet returns.
    fsDB.enablePersistence({synchronizeTabs:true}).catch(err=>{
      console.warn('Offline persistence not enabled:', err.code);
      // Not fatal — app still works fine online, it just won't function
      // without internet on this particular browser/device.
    });
  }catch(e){
    console.error('Firebase init failed', e);
    showCloudConnectError('Firebase could not start: '+e.message);
    return false;
  }
  try{ fbStorage = firebase.storage(); }catch(e){ fbStorage = null; } // Storage is optional; bill photos are stored in Firestore instead (see ensureFirestoreSafePhoto)
  firebase.auth().onAuthStateChanged(async user=>{
    if(user){
      currentUserEmail = user.email || '';
      try{
        const roleDoc = await fsDB.collection('users').doc(user.uid).get();
        serverRole = roleDoc.exists ? (roleDoc.data().role || 'staff') : 'staff';
      }catch(e){
        console.error('Could not read role', e);
        serverRole = 'staff';   // fail closed — least privilege if role can't be read
      }
      CLOUD_MODE = true;
      if(serverRole !== 'owner'){
        // Device may hold owner data from an earlier local session; staff must
        // never see it and nothing will refresh it, so clear it out.
        db.expenses = [];
        db.auditLog = [];
        db.staff = [];
        db.staffLedger = [];
      }
      updateCloudBadge();
      attachCloudListeners();
      setScreen('dashboard');
    } else {
      detachCloudListeners();
      CLOUD_MODE = false;
      serverRole = null;
      currentUserEmail = '';
      updateCloudBadge();
      showLoginScreen();
    }
  });
  return true;
}

function showCloudConnectError(message){
  if(CLOUD_MODE) return; // already connected by the time this fires, ignore
  const main = document.getElementById('main');
  if(!main) return;
  main.innerHTML = `
    <div class="card">
      <h3>Couldn't connect to cloud sync</h3>

      <div class="step" style="margin-bottom:10px;"><b>Things to check:</b><br>
        1. Firestore Database → <b>Rules</b> tab → the rules were pasted and you tapped <b>Publish</b> (not just typed them in).<br>
        2. Authentication → Sign-in method → <b>Anonymous</b> shows Enabled.<br>
        3. The config pasted into this app exactly matches the one from Firebase → Project settings → Your apps (no missing commas/quotes).
      </div>
      <button class="btn btn-primary" onclick="location.reload()">Retry</button>

    </div>
  `;
}

function listenerError(label){
  return function(err){
    console.error(label+' listener', err);
    if(!firebase.auth().currentUser) return;   // signing out — expected, ignore
    if(label==='stock') showCloudConnectError('Database error ('+label+'): '+err.code+' — '+err.message);
  };
}
function attachCloudListeners(){
  detachCloudListeners();
  const sub = fn => cloudUnsubscribers.push(fn);

  sub(fsDB.collection('stock').onSnapshot(snap=>{ db.stock = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('stock')));
  sub(fsDB.collection('sales').orderBy('createdAt','desc').limit(200).onSnapshot(snap=>{ db.sales = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('sales')));
  sub(fsDB.collection('saleReturns').orderBy('createdAt','desc').limit(200).onSnapshot(snap=>{ db.saleReturns = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('saleReturns')));
  sub(fsDB.collection('parties').onSnapshot(snap=>{ db.parties = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('parties')));
  sub(fsDB.collection('payments').orderBy('createdAt','desc').limit(300).onSnapshot(snap=>{ db.payments = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('payments')));
  sub(fsDB.collection('settings').doc('shopInfo').onSnapshot(snap=>{ if(snap.exists) db.shopInfo = snap.data(); render(); }, listenerError('shopInfo')));

  // Purchase data exposes what you paid the distributor — owner only.
  if(!isServerOwner()) return;
  sub(fsDB.collection('purchases').orderBy('createdAt','desc').limit(200).onSnapshot(snap=>{ db.purchases = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('purchases')));
  sub(fsDB.collection('purchaseReturns').orderBy('createdAt','desc').limit(200).onSnapshot(snap=>{ db.purchaseReturns = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('purchaseReturns')));
  sub(fsDB.collection('expenses').onSnapshot(snap=>{ db.expenses = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('expenses')));
  sub(fsDB.collection('auditLog').orderBy('createdAt','desc').limit(300).onSnapshot(snap=>{ db.auditLog = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('auditLog')));
  sub(fsDB.collection('staff').onSnapshot(snap=>{ db.staff = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('staff')));
  sub(fsDB.collection('staffLedger').onSnapshot(snap=>{ db.staffLedger = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }, listenerError('staffLedger')));
}

async function savePurchaseCloud(){
  const valid = purchaseDraft.items.filter(it=>it.itemName.trim() && it.batch.trim() && Number(it.qty)>0);
  if(!valid.length){ alert('Add at least one item with name, batch and quantity before saving.'); return; }
  try{
    let photoData = null;
    if(purchaseDraft.photo){
      photoData = await ensureFirestoreSafePhoto(purchaseDraft.photo);
    }
    const billNo = await nextBillNoCloud('purchase');
    const batchWrite = fsDB.batch();
    let totalAmount=0, totalGst=0;
    valid.forEach(it=>{
      const amt = Number(it.qty)*Number(it.rate);
      const gstAmt = amt*Number(it.gst)/100;
      totalAmount += amt; totalGst += gstAmt;
      const stockRef = fsDB.collection('stock').doc(slugId(it.itemName, it.batch));
      const patch = {
        itemName: it.itemName.trim(), batch: it.batch.trim(),
        purchaseRate: Number(it.rate), gst: Number(it.gst),
        mrp: Number(it.mrp)>0 ? Number(it.mrp) : Number(it.rate)*1.2,
        qty: firebase.firestore.FieldValue.increment(Number(it.qty)+Number(it.freeQty))
      };
      if(it.expiry) patch.expiry = it.expiry;
      batchWrite.set(stockRef, patch, {merge:true});
    });
    const purchaseRef = fsDB.collection('purchases').doc();
    const fullTotal = totalAmount+totalGst;
    const amountPaid = purchaseDraft.partyId ? (purchaseDraft.paidInFull!==false ? fullTotal : Number(purchaseDraft.amountPaid)||0) : fullTotal;
    batchWrite.set(purchaseRef, {
      date: todayStr(), billNo, supplier: purchaseDraft.supplier||'Unknown supplier',
      photo: photoData, items: valid, totalAmount, totalGst,
      partyId: purchaseDraft.partyId||null, amountPaid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await batchWrite.commit();
    purchaseDraft = {photo:null, supplier:'', items:[], partyId:null, paidInFull:true, amountPaid:0};
    openPrintPreview('purchase', purchaseRef.id);
  }catch(e){
    console.error(e);
    alert('Could not save to cloud: '+e.message);
  }
}

async function saveSaleCloud(){
  if(!saleDraft.items.length){ alert('Add at least one item to the bill.'); return; }
  const saleRefHolder = {ref:null};
  try{
    const billNo = await nextBillNoCloud('sale');
    await fsDB.runTransaction(async (tx)=>{
      const refs = saleDraft.items.map(it=>fsDB.collection('stock').doc(it.stockId));
      const snaps = await Promise.all(refs.map(r=>tx.get(r)));
      snaps.forEach((snap,i)=>{
        const it = saleDraft.items[i];
        const needed = Number(it.qty)+Number(it.freeQty);
        const avail = snap.exists ? (snap.data().qty||0) : 0;
        if(avail < needed) throw new Error(`Not enough stock for ${it.itemName} (batch ${it.batch}). Available: ${avail}`);
      });
      let totalNet=0, totalGst=0, totalDiscount=0;
      snaps.forEach((snap,i)=>{
        const it = saleDraft.items[i];
        const needed = Number(it.qty)+Number(it.freeQty);
        tx.update(refs[i], {qty: firebase.firestore.FieldValue.increment(-needed)});
        saleDraft.items[i].costAtSale = snap.exists ? (snap.data().purchaseRate||0) : 0;
        const gross = Number(it.qty)*Number(it.rate);
        const disc = gross*Number(it.discount)/100;
        const net = gross-disc; // MRP already includes GST — this is what the customer pays
        const taxable = net/(1+Number(it.gst)/100);
        const gstAmt = net-taxable;
        totalNet += net; totalGst += gstAmt; totalDiscount += disc;
      });
      const saleRef = fsDB.collection('sales').doc();
      saleRefHolder.ref = saleRef;
      const fullSaleTotal = totalNet;
      const saleAmountPaid = saleDraft.partyId ? (saleDraft.paidInFull!==false ? fullSaleTotal : Number(saleDraft.amountPaid)||0) : fullSaleTotal;
      tx.set(saleRef, {
        date: todayStr(), billNo, customer: saleDraft.customer||'Walk-in', items: saleDraft.items,
        totalAmount: fullSaleTotal, totalGst, totalDiscount,
        partyId: saleDraft.partyId||null, amountPaid: saleAmountPaid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    saleDraft = {customer:'', items:[], partyId:null, paidInFull:true, amountPaid:0}; showNewCustomerForm=false;
    openPrintPreview('sale', saleRefHolder.ref.id);
    return;
  }catch(e){
    console.error(e);
    alert(e.message);
  }
}

      render();

  };
  reader.readAsText(file);

/* ===================== EXPIRY RETURN ALERT ===================== */
/* Distributors normally only accept returns while a reasonable window is left
   before expiry. Past that window the stock becomes a straight loss, so this
   screen surfaces what to send back while it still counts. */
let expiryWindowDays = Number(localStorage.getItem('hdh_expiry_window')) || 120;
function setExpiryWindow(d){ expiryWindowDays = Number(d)||120; localStorage.setItem('hdh_expiry_window', expiryWindowDays); render(); }
function renderExpiryAlert(){
  const rows = db.stock
    .filter(s=> s.qty>0)
    .map(s=>({s, days: daysUntil(s.expiry)}))
    .filter(x=> x.days!==null && x.days <= expiryWindowDays)
    .sort((a,b)=> a.days-b.days);
  const expired = rows.filter(x=>x.days < 0);
  const actionable = rows.filter(x=>x.days >= 0);
  const valueAtRisk = actionable.reduce((a,x)=> a + x.s.qty*(x.s.purchaseRate||0), 0);
  const line = (x, isExpired)=>`
    <div class="list-row">
      <div style="flex:1;">
        <div class="li-main">${x.s.itemName}</div>
        <div class="li-sub">Batch ${x.s.batch||'—'} • Exp ${x.s.expiry||'—'} • ${x.s.qty} unit(s)${isExpired?'' : ' • '+x.days+' days left'}</div>
      </div>
      <div class="li-right" style="color:${isExpired?'var(--red-700)':'var(--amber-600)'};">${fmt(x.s.qty*(x.s.purchaseRate||0))}</div>
    </div>`;
  return `
    <button class="btn btn-ghost" style="margin-bottom:10px;" onclick="setScreen('dashboard')">← Back to Dashboard</button>
    <div class="stat-grid">
      <div class="stat"><div class="num">${actionable.length}</div><div class="lbl">To return now</div></div>
      <div class="stat"><div class="num">${fmt(valueAtRisk)}</div><div class="lbl">Value you can still recover</div></div>
    </div>
    <div class="card">
      <h3>Alert window</h3>
      <div class="step">Flag stock expiring within this many days. Most distributors accept returns 3–6 months ahead, so 120 days is a safe default.</div>
      <div class="field"><label>Days</label><input type="number" value="${expiryWindowDays}" onchange="setExpiryWindow(this.value)"/></div>
    </div>
    <div class="card">
      <h3>Return to distributor (${actionable.length})</h3>
      <div class="step">Still within the window — send these back to recover the money.</div>
      ${actionable.length ? actionable.map(x=>line(x,false)).join('') : `<div class="empty">Nothing needs returning right now.</div>`}
      ${actionable.length ? `<button class="btn btn-primary" style="margin-top:10px;" onclick="setScreen('purchase')">Start a purchase return →</button>` : ''}
    </div>
    ${expired.length ? `
    <div class="card">
      <h3 style="color:var(--red-700);">Already expired (${expired.length})</h3>
      <div class="step">Past expiry — most distributors will not accept these. Remove from shelves.</div>
      ${expired.map(x=>line(x,true)).join('')}
    </div>` : ''}
  `;
}
window.setExpiryWindow = setExpiryWindow;

function saveExpense(){
  const date = document.getElementById('expDate').value;
  const category = document.getElementById('expCategory').value;
  const amount = Number(document.getElementById('expAmount').value);
  const note = document.getElementById('expNote').value.trim();
  if(!date || !amount || amount<=0){ alert('Enter a date and a valid amount.'); return false; }
  const record = {date, category, amount, note};
  logAudit('Expense '+(editingExpenseId?'edited':'added'), category+' • '+fmt(amount));
  if(editingExpenseId){
    if(CLOUD_MODE) fsDB.collection('expenses').doc(editingExpenseId).update(record).catch(e=>alert('Could not save: '+e.message));
    else { const i = db.expenses.findIndex(e=>e.id===editingExpenseId); if(i>-1) db.expenses[i]=Object.assign({id:editingExpenseId},record); saveDB(db); }
    editingExpenseId = null;
  } else {
    if(CLOUD_MODE) fsDB.collection('expenses').add(Object.assign({},record,{createdAt:firebase.firestore.FieldValue.serverTimestamp()})).catch(e=>alert('Could not save: '+e.message));
    else { record.id = nextId('EXP'); db.expenses.push(record); saveDB(db); }
  }
  render();
  return true;
}

  if(!confirm('Delete this expense entry?')) return;
  logAudit('Expense deleted', id);
  if(CLOUD_MODE) fsDB.collection('expenses').doc(id).delete().catch(e=>alert('Could not delete: '+e.message));
  else { db.expenses = db.expenses.filter(e=>e.id!==id); saveDB(db); render(); }
}
function renderExpenses(){
  if(!isOwner()) return ownerOnlyNotice();
  const today = todayStr();
  if(!expenseFilter.from) expenseFilter.from = today.slice(0,8)+'01';
  if(!expenseFilter.to) expenseFilter.to = today;

/* ===================== PROFIT & LOSS ===================== */
let pnlMode = 'monthly';
let pnlMonth = new Date().toISOString().slice(0,7);
let pnlFrom = todayStr(), pnlTo = todayStr();
function renderPnL(){
  if(!isOwner()) return ownerOnlyNotice();
  const today = todayStr();
  let sales, purchases, saleReturns, expenses, label;
  if(pnlMode==='daily'){
    sales=db.sales.filter(s=>s.date===today); purchases=db.purchases.filter(p=>p.date===today);
    saleReturns=db.saleReturns.filter(r=>r.date===today); expenses=(db.expenses||[]).filter(e=>e.date===today); label='Today';
  } else if(pnlMode==='monthly'){
    sales=db.sales.filter(s=>s.date.startsWith(pnlMonth)); purchases=db.purchases.filter(p=>p.date.startsWith(pnlMonth));
    saleReturns=db.saleReturns.filter(r=>r.date.startsWith(pnlMonth)); expenses=(db.expenses||[]).filter(e=>e.date.startsWith(pnlMonth)); label=pnlMonth;
  } else {
    sales=db.sales.filter(s=>s.date>=pnlFrom&&s.date<=pnlTo); purchases=db.purchases.filter(p=>p.date>=pnlFrom&&p.date<=pnlTo);
    saleReturns=db.saleReturns.filter(r=>r.date>=pnlFrom&&r.date<=pnlTo); expenses=(db.expenses||[]).filter(e=>e.date>=pnlFrom&&e.date<=pnlTo); label=pnlFrom+' to '+pnlTo;
  }
  // Revenue is GST-exclusive; MRP already includes GST so strip it back out.
  let revenue=0, outputGst=0, cogs=0;
  sales.forEach(s=>{
    (s.items||[]).forEach(it=>{
      const gross=Number(it.qty)*Number(it.rate), disc=gross*Number(it.discount||0)/100, net=gross-disc;
      const taxable=net/(1+Number(it.gst||0)/100);
      revenue += taxable; outputGst += net-taxable;
      cogs += Number(it.qty)*(it.costAtSale!=null?it.costAtSale:0);
    });
  });
  let returnRevenue=0;
  saleReturns.forEach(r=>{ (r.items||[]).forEach(it=>{
    const net=Number(it.qty)*Number(it.rate);
    returnRevenue += net/(1+Number(it.gst||0)/100);
  });});
  const inputGst = purchases.reduce((a,p)=>a+(p.totalGst||0),0);
  const netRevenue = revenue-returnRevenue;
  const grossProfit = netRevenue-cogs;
  const opex = expenses.reduce((a,e)=>a+Number(e.amount||0),0);
  const netProfit = grossProfit-opex;
  const netGst = outputGst-inputGst;
  return `
    <button class="btn btn-ghost" style="margin-bottom:10px;" onclick="setScreen('reports')">← Back to Reports</button>
    <div class="segment">
      <button class="${pnlMode==='daily'?'active':''}" onclick="pnlMode='daily';render()">Daily</button>
      <button class="${pnlMode==='monthly'?'active':''}" onclick="pnlMode='monthly';render()">Monthly</button>
      <button class="${pnlMode==='custom'?'active':''}" onclick="pnlMode='custom';render()">Custom</button>
    </div>
    ${pnlMode==='monthly'?`<div class="field"><label>Month</label><input type="month" value="${pnlMonth}" onchange="pnlMonth=this.value;render()"/></div>`:''}
    ${pnlMode==='custom'?`<div class="row2">
      <div class="field"><label>From</label><input type="date" value="${pnlFrom}" onchange="pnlFrom=this.value;render()"/></div>
      <div class="field"><label>To</label><input type="date" value="${pnlTo}" onchange="pnlTo=this.value;render()"/></div></div>`:''}
    <div class="card">
      <h3>${label} — Profit &amp; Loss</h3>
      <div class="total-line"><span>Net sales (excl. GST)</span><span>${fmt(netRevenue)}</span></div>
      <div class="total-line"><span>Cost of medicines sold</span><span>-${fmt(cogs)}</span></div>
      <div class="total-line grand"><span>Gross Profit</span><span>${fmt(grossProfit)}</span></div>
      <div class="total-line" style="margin-top:10px;"><span>Expenses (rent, salary, etc.)</span><span>-${fmt(opex)}</span></div>
      <div class="total-line grand" style="color:${netProfit<0?'var(--red-700)':'var(--green-700, var(--teal-900))'};"><span>Net Profit${netProfit<0?' (Loss)':''}</span><span>${fmt(netProfit)}</span></div>
    </div>
    <div class="card">
      <h3>GST position (not part of profit)</h3>
      <div class="total-line"><span>Output GST (on sales)</span><span>${fmt(outputGst)}</span></div>
      <div class="total-line"><span>Input Tax Credit (on purchases)</span><span>-${fmt(inputGst)}</span></div>
      <div class="total-line grand"><span>Net GST ${netGst>=0?'Payable':'Receivable'}</span><span>${fmt(Math.abs(netGst))}</span></div>
    </div>
    <div class="card">
      <h3>How this is calculated</h3>
      <div class="step">• Cost uses the purchase rate recorded when each item was sold.</div>
      <div class="step">• GST is excluded from profit entirely and shown separately as a compliance figure.</div>
      <div class="step">• Items sold before cost tracking existed count as zero cost, which overstates profit for older bills.</div>
    </div>`;
}

/* Positive balance = you still owe the staff member. Salary Due increases it,
   Salary Payment and Advance reduce it. Only actual payments count as a
   business expense — an advance is money lent, not spent. */
function staffBalance(staffId){
  const st = (db.staff||[]).find(s=>s.id===staffId);
  if(!st) return 0;
  let bal = Number(st.openingBalance)||0;
  (db.staffLedger||[]).filter(e=>e.staffId===staffId).forEach(e=>{
    if(e.type==='due') bal += Number(e.amount)||0;
    else bal -= Number(e.amount)||0;
  });
  return bal;
}

function saveStaffEdits(id){
  const name = document.getElementById('editStaffName').value.trim();
  if(!name){ alert('Name cannot be empty.'); return; }
  const updates = {
    name,
    role: document.getElementById('editStaffRole').value.trim(),
    phone: document.getElementById('editStaffPhone').value.trim(),
    monthlySalary: Number(document.getElementById('editStaffSalary').value)||0
  };
  logAudit('Staff details edited', name);
  if(CLOUD_MODE) fsDB.collection('staff').doc(id).update(updates).catch(e=>alert('Could not save: '+e.message));
  else { const s = db.staff.find(x=>x.id===id); if(s) Object.assign(s, updates); saveDB(db); }
  editingStaffDetails = false;
  render();
}
function deleteStaff(id){
  const st = (db.staff||[]).find(s=>s.id===id);
  if(!st) return;
  if((db.staffLedger||[]).some(e=>e.staffId===id)){ alert("Can't delete — this staff member has salary history. Deleting would lose that record."); return; }
  if(!confirm('Delete '+st.name+'?')) return;
  logAudit('Staff deleted', st.name);
  if(CLOUD_MODE) fsDB.collection('staff').doc(id).delete().catch(e=>alert('Could not delete: '+e.message));
  else { db.staff = db.staff.filter(s=>s.id!==id); saveDB(db); }
  setScreen('staffList');
}
function saveStaffEntry(staffId){
  const type = document.getElementById('staffEntryType').value;
  const amount = Number(document.getElementById('staffEntryAmount').value);
  const date = document.getElementById('staffEntryDate').value;
  const note = document.getElementById('staffEntryNote').value.trim();
  if(!amount || amount<=0){ alert('Enter a valid amount.'); return; }
  const st = (db.staff||[]).find(s=>s.id===staffId);
  const entry = {staffId, type, amount, date, note};
  logAudit('Staff '+type, (st?st.name:'')+' • '+fmt(amount));
  if(CLOUD_MODE){
    fsDB.collection('staffLedger').add(Object.assign({},entry,{createdAt:firebase.firestore.FieldValue.serverTimestamp()})).catch(e=>alert('Could not save: '+e.message));
  } else {
    entry.id = nextId('SFL'); if(!db.staffLedger) db.staffLedger=[]; db.staffLedger.push(entry); saveDB(db); render();
  }
  // A real payment leaves the business, so mirror it into Expenses automatically.
  if(type==='payment'){
    const exp = {date, category:'Staff Salary', amount, note:'Salary paid to '+(st?st.name:'')+(note?' — '+note:'')};
    if(CLOUD_MODE) fsDB.collection('expenses').add(Object.assign({},exp,{createdAt:firebase.firestore.FieldValue.serverTimestamp()})).catch(e=>console.error(e));
    else { exp.id = nextId('EXP'); if(!db.expenses) db.expenses=[]; db.expenses.push(exp); saveDB(db); }
  }
}

function addPurchaseItem(){
  purchaseDraft.items.push({itemName:'',batch:'',expiry:'',qty:0,freeQty:0,rate:0,mrp:0,gst:5,detected:null});
  render();
}
function removePurchaseItem(idx){ purchaseDraft.items.splice(idx,1); render(); }
function updatePurchaseItem(idx,field,val){
  purchaseDraft.items[idx][field] = (field==='itemName'||field==='batch'||field==='expiry') ? val : Number(val);
  if(field!=='itemName' && field!=='batch' && field!=='expiry'){
    // re-render totals without losing focus is tricky in vanilla; keep simple, re-render on blur-like fields only
  }
}
/* As the user types digits for expiry, auto-insert "/" after the month
   (2 digits), so typing "1227" becomes "12/27" without them needing
   to type the slash themselves. Format is MM/YY (2-digit year). */
function maskExpiryInput(el, idx){
  let digits = el.value.replace(/[^0-9]/g, '').slice(0, 4);
  let formatted = digits;
  if(digits.length > 2){
    formatted = digits.slice(0,2) + '/' + digits.slice(2);
  }
  el.value = formatted;
  updatePurchaseItem(idx, 'expiry', formatted);
}
function bumpFree(idx, n){
  purchaseDraft.items[idx].freeQty = (Number(purchaseDraft.items[idx].freeQty)||0) + n;
  render();
}
function savePurchase(){
  if(CLOUD_MODE){ savePurchaseCloud(); return; }
  const valid = purchaseDraft.items.filter(it=>it.itemName.trim() && it.batch.trim() && Number(it.qty)>0);
  if(!valid.length){ alert('Add at least one item with name, batch and quantity before saving.'); return; }
  const id = nextId('PUR');
  const billNo = nextBillNoLocal('purchase');
  let totalAmount=0, totalGst=0;
  valid.forEach(it=>{
    const amt = Number(it.qty)*Number(it.rate);
    const gstAmt = amt*Number(it.gst)/100;
    totalAmount += amt; totalGst += gstAmt;
    let stockRow = findStock(it.itemName, it.batch);
    const typedMrp = Number(it.mrp)>0 ? Number(it.mrp) : Number(it.rate)*1.2;
    if(!stockRow){
      stockRow = {id: slugId(it.itemName, it.batch), itemName:it.itemName.trim(), batch:it.batch.trim(), expiry:it.expiry, mrp:typedMrp, purchaseRate:Number(it.rate), gst:Number(it.gst), qty:0};
      db.stock.push(stockRow);
    }
    stockRow.qty += Number(it.qty)+Number(it.freeQty);
    stockRow.purchaseRate = Number(it.rate);
    stockRow.mrp = typedMrp;
    if(it.expiry) stockRow.expiry = it.expiry;
  });
  const fullTotal = totalAmount+totalGst;
  const amountPaid = purchaseDraft.partyId ? (purchaseDraft.paidInFull!==false ? fullTotal : Number(purchaseDraft.amountPaid)||0) : fullTotal;
  db.purchases.push({id, billNo, date:todayStr(), supplier:purchaseDraft.supplier||'Unknown supplier', photo:purchaseDraft.photo, items:valid, totalAmount, totalGst, partyId:purchaseDraft.partyId||null, amountPaid});
  saveDB(db);
  purchaseDraft = {photo:null, supplier:'', items:[], partyId:null, paidInFull:true, amountPaid:0};
  openPrintPreview('purchase', id);
}

      </div>

      <div class="hint">Works for regular returns as well as expired stock — search finds every batch of that item, including ones near or past expiry.</div>
    </div>

      <div class="total-line"><span>GST</span><span>${fmt(totalGst)}</span></div>
      <div class="total-line grand"><span>Total credit expected</span><span>${fmt(totalValue+totalGst)}</span></div>
    </div>
    <button class="btn btn-primary" onclick="savePurchaseReturn()">Confirm & save return</button>

function renderPReturnSearchResults(q){
  const box = document.getElementById('pReturnSearchResults');
  if(!q || q.trim().length<1){ box.innerHTML=''; return; }
  const matches = db.stock.filter(s=> s.qty>0 && s.itemName.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  if(!matches.length){ box.innerHTML = `<div class="empty" style="padding:14px;">No matching stock found.</div>`; return; }
  box.innerHTML = matches.map(s=>{
    const dLeft = daysUntil(s.expiry);
    const expTag = dLeft<=90 ? `<span class="tag exp" style="margin-left:6px;">Exp in ${dLeft}d</span>` : '';
    return `
    <div class="list-row" style="cursor:pointer;" onclick="pickStockForPReturn('${s.id}')">
      <div><div class="li-main">${s.itemName}${expTag}</div><div class="li-sub">Batch ${s.batch} • Qty ${s.qty} • Exp ${s.expiry}</div></div>
      <div class="li-right">${fmt(s.purchaseRate)}</div>
    </div>`;
  }).join('');
}
function pickStockForPReturn(stockId){
  const s = db.stock.find(x=>x.id===stockId);
  if(!s) return;
  if(purchaseReturnDraft.items.find(it=>it.stockId===stockId)){ document.getElementById('pReturnSearch').value=''; render(); return; }
  purchaseReturnDraft.items.push({stockId:s.id, itemName:s.itemName, batch:s.batch, expiry:s.expiry, availableQty:s.qty, qty:s.qty, rate:s.purchaseRate, gst:s.gst, reason:'Expired'});
  document.getElementById('pReturnSearch').value='';
  render();
}
function removePurchaseReturnItem(idx){ purchaseReturnDraft.items.splice(idx,1); render(); }
function updatePurchaseReturnItem(idx,field,val){
  purchaseReturnDraft.items[idx][field] = field==='qty' ? Number(val) : val;
}
function savePurchaseReturn(){
  if(CLOUD_MODE){ savePurchaseReturnCloud(); return; }
  const valid = purchaseReturnDraft.items.filter(it=>Number(it.qty)>0);
  if(!valid.length){ alert('Add at least one item to return.'); return; }
  for(const it of valid){
    const s = db.stock.find(x=>x.id===it.stockId);
    if(!s || Number(it.qty) > s.qty){ alert(`Return qty for ${it.itemName} can't exceed current stock (${s?s.qty:0}).`); return; }
  }
  let totalAmount=0, totalGst=0;
  valid.forEach(it=>{
    const amt = Number(it.qty)*Number(it.rate);
    const gstAmt = amt*Number(it.gst)/100;
    totalAmount += amt; totalGst += gstAmt;
    const s = db.stock.find(x=>x.id===it.stockId);
    s.qty -= Number(it.qty);
  });
  const id = nextId('PRET');
  const billNo = nextBillNoLocal('purchase');
  db.purchaseReturns.push({id, billNo, date:todayStr(), items:valid, totalAmount, totalGst});
  saveDB(db);
  purchaseReturnDraft = {items:[]};
  openPrintPreview('purchaseReturn', id);
}
async function savePurchaseReturnCloud(){
  const valid = purchaseReturnDraft.items.filter(it=>Number(it.qty)>0);
  if(!valid.length){ alert('Add at least one item to return.'); return; }
  try{
    const retRef = fsDB.collection('purchaseReturns').doc();
    const billNo = await nextBillNoCloud('purchase');
    await fsDB.runTransaction(async (tx)=>{
      const refs = valid.map(it=>fsDB.collection('stock').doc(it.stockId));
      const snaps = await Promise.all(refs.map(r=>tx.get(r)));
      let totalAmount=0, totalGst=0;
      snaps.forEach((snap,i)=>{
        const it = valid[i];
        const avail = snap.exists ? (snap.data().qty||0) : 0;
        if(Number(it.qty) > avail) throw new Error(`Return qty for ${it.itemName} can't exceed current stock (${avail}).`);
      });
      snaps.forEach((snap,i)=>{
        const it = valid[i];
        tx.update(refs[i], {qty: firebase.firestore.FieldValue.increment(-Number(it.qty))});
        totalAmount += Number(it.qty)*Number(it.rate);
        totalGst += Number(it.qty)*Number(it.rate)*Number(it.gst)/100;
      });
      tx.set(retRef, {date:todayStr(), billNo, items:valid, totalAmount, totalGst, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    });
    purchaseReturnDraft = {items:[]};
    openPrintPreview('purchaseReturn', retRef.id);
  }catch(e){
    console.error(e);
    alert(e.message);
  }
}

function renderSaleSearchResults(q){
  const box = document.getElementById('saleSearchResults');
  const query = (q||'').trim().toLowerCase();
  if(!query){ box.innerHTML = ''; return; }
  const matches = db.stock
    .filter(s=> s.qty>0 && s.itemName.toLowerCase().includes(query))
    .slice(0, 20);
  if(!matches.length){ box.innerHTML = `<div class="empty" style="padding:14px;">No matching stock found.</div>`; return; }
  box.innerHTML = matches.map(s=>{
    const qty = saleQtyForStock(s.id);
    const control = qty>0
      ? `<div style="display:flex;align-items:center;gap:8px;">
           <button class="chip" style="padding:6px 12px;" onclick="decrementSaleStock('${s.id}')">−</button>
           <span style="min-width:18px;text-align:center;font-weight:700;">${qty}</span>
           <button class="chip" style="padding:6px 12px;" onclick="incrementSaleStock('${s.id}')">+</button>
         </div>`
      : `<button class="btn btn-primary btn-sm" onclick="incrementSaleStock('${s.id}')">Add +</button>`;
    return `
    <div class="list-row">
      <div><div class="li-main">${s.itemName}</div><div class="li-sub">Batch ${s.batch} • Qty ${s.qty} • Exp ${s.expiry}</div></div>
      ${control}
    </div>`;
  }).join('');
}
function saleQtyForStock(stockId){
  const it = saleDraft.items.find(x=>x.stockId===stockId);
  return it ? Number(it.qty)||0 : 0;
}
function refreshSaleScreenKeepSearch(){
  const box = document.getElementById('saleSearch');
  const q = box ? box.value : '';
  render();
  const newBox = document.getElementById('saleSearch');
  if(newBox){ newBox.value = q; renderSaleSearchResults(q); }
}
function incrementSaleStock(stockId){
  if(!stockId) return;
  const it = saleDraft.items.find(x=>x.stockId===stockId);
  if(it){ it.qty = (Number(it.qty)||0)+1; refreshSaleScreenKeepSearch(); }
  else { pickStockForSaleKeepList(stockId); }
}
function decrementSaleStock(stockId){
  const idx = saleDraft.items.findIndex(x=>x.stockId===stockId);
  if(idx<0) return;
  const newQty = (Number(saleDraft.items[idx].qty)||0)-1;
  if(newQty<=0){ saleDraft.items.splice(idx,1); } else { saleDraft.items[idx].qty = newQty; }
  refreshSaleScreenKeepSearch();
}
function pickStockForSaleKeepList(stockId){
  const s = db.stock.find(x=>x.id===stockId);
  if(!s) return;
  saleDraft.items.push({stockId:s.id, itemName:s.itemName, batch:s.batch, qty:1, freeQty:0, discount:0, rate:s.mrp, gst:s.gst});
  refreshSaleScreenKeepSearch();
}
function pickStockForSale(stockId){
  const s = db.stock.find(x=>x.id===stockId);
  if(!s) return;
  saleDraft.items.push({stockId:s.id, itemName:s.itemName, batch:s.batch, qty:1, freeQty:0, discount:0, rate:s.mrp, gst:s.gst});
  document.getElementById('saleSearch').value='';
  render();
}
function removeSaleItem(idx){ saleDraft.items.splice(idx,1); render(); }
function updateSaleItem(idx,field,val){
  saleDraft.items[idx][field] = Number(val);
  render();
}
function saveSale(){
  if(CLOUD_MODE){ saveSaleCloud(); return; }
  for(const it of saleDraft.items){
    const s = db.stock.find(x=>x.id===it.stockId);
    const needed = Number(it.qty)+Number(it.freeQty);
    if(!s || s.qty < needed){
      alert(`Not enough stock for ${it.itemName} (batch ${it.batch}). Available: ${s?s.qty:0}`);
      return;
    }
  }
  const id = nextId('SAL');
  const billNo = nextBillNoLocal('sale');
  let totalNet=0, totalGst=0, totalDiscount=0;
  saleDraft.items.forEach(it=>{
    const gross = Number(it.qty)*Number(it.rate);
    const disc = gross*Number(it.discount)/100;
    const net = gross-disc; // MRP already includes GST — this is what the customer pays
    const taxable = net/(1+Number(it.gst)/100);
    const gstAmt = net-taxable;
    totalNet += net; totalGst += gstAmt; totalDiscount += disc;
    const s = db.stock.find(x=>x.id===it.stockId);
    // Snapshot cost at the moment of sale so Profit & Loss stays accurate even
    // if the same medicine is repurchased later at a different rate.
    it.costAtSale = s ? (s.purchaseRate||0) : 0;
    s.qty -= (Number(it.qty)+Number(it.freeQty));
  });
  const fullSaleTotal = totalNet;
  const saleAmountPaid = saleDraft.partyId ? (saleDraft.paidInFull!==false ? fullSaleTotal : Number(saleDraft.amountPaid)||0) : fullSaleTotal;
  db.sales.push({id, billNo, date:todayStr(), customer:saleDraft.customer||'Walk-in', items:saleDraft.items, totalAmount:fullSaleTotal, totalGst, totalDiscount, partyId:saleDraft.partyId||null, amountPaid:saleAmountPaid});
  saveDB(db);
  saleDraft = {customer:'', items:[], partyId:null, paidInFull:true, amountPaid:0}; showNewCustomerForm=false;
  openPrintPreview('sale', id);
}

function pickSaleForReturn(saleId){
  const sale = db.sales.find(s=>s.id===saleId);
  if(!sale) return;
  saleReturnDraft.sale = sale;
  saleReturnDraft.items = sale.items.map(it=>({
    stockId:it.stockId, itemName:it.itemName, batch:it.batch, soldQty:it.qty,

  }));

function updateSaleReturnItem(idx,field,val){
  saleReturnDraft.items[idx][field] = field==='qty' ? Number(val) : val;
}
function saveSaleReturn(){
  if(CLOUD_MODE){ saveSaleReturnCloud(); return; }
  const valid = saleReturnDraft.items.filter(it=>Number(it.qty)>0 && Number(it.qty)<=Number(it.soldQty));
  if(!valid.length){ alert('Set a return quantity (up to the sold quantity) for at least one item.'); return; }
  let totalAmount=0, totalGst=0;
  valid.forEach(it=>{
    const amt = Number(it.qty)*Number(it.rate);
    const taxable = amt/(1+Number(it.gst)/100);
    const gstAmt = amt-taxable;
    totalAmount += amt; totalGst += gstAmt;
    const s = db.stock.find(x=>x.id===it.stockId);
    if(s) s.qty += Number(it.qty);
  });
  const id = nextId('SRET');
  const billNo = nextBillNoLocal('sale');
  db.saleReturns.push({id, billNo, date:todayStr(), refSaleId:saleReturnDraft.sale.billNo||saleReturnDraft.sale.id, items:valid, totalAmount, totalGst});
  saveDB(db);
  saleReturnDraft = {sale:null, items:[]};
  openPrintPreview('saleReturn', id);
}
async function saveSaleReturnCloud(){
  const valid = saleReturnDraft.items.filter(it=>Number(it.qty)>0 && Number(it.qty)<=Number(it.soldQty));
  if(!valid.length){ alert('Set a return quantity (up to the sold quantity) for at least one item.'); return; }
  try{
    const batchWrite = fsDB.batch();
    const retRef = fsDB.collection('saleReturns').doc();
    const billNo = await nextBillNoCloud('sale');
    let totalAmount=0, totalGst=0;
    valid.forEach(it=>{
      const amt = Number(it.qty)*Number(it.rate);
      const taxable = amt/(1+Number(it.gst)/100);
      totalAmount += amt; totalGst += (amt-taxable);
      if(it.stockId){
        const stockRef = fsDB.collection('stock').doc(it.stockId);
        batchWrite.set(stockRef, {qty: firebase.firestore.FieldValue.increment(Number(it.qty))}, {merge:true});
      }
    });
    batchWrite.set(retRef, {date:todayStr(), billNo, refSaleId:saleReturnDraft.sale.billNo||saleReturnDraft.sale.id, items:valid, totalAmount, totalGst, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    await batchWrite.commit();
    saleReturnDraft = {sale:null, items:[]};
    openPrintPreview('saleReturn', retRef.id);
  }catch(e){
    console.error(e);
    alert(e.message);
  }
}

let reportMode = 'daily';
let selectedMonth = new Date().toISOString().slice(0,7); // YYYY-MM, defaults to current month
function renderReports(){
  const today = todayStr();
  const month = reportMode==='monthly' ? selectedMonth : today.slice(0,7);

  const sales = reportMode==='daily' ? db.sales.filter(s=>s.date===today) : db.sales.filter(s=>s.date.startsWith(month));
  const purchases = reportMode==='daily' ? db.purchases.filter(p=>p.date===today) : db.purchases.filter(p=>p.date.startsWith(month));
  const saleReturns = reportMode==='daily' ? db.saleReturns.filter(r=>r.date===today) : db.saleReturns.filter(r=>r.date.startsWith(month));
  const purchaseReturns = reportMode==='daily' ? db.purchaseReturns.filter(r=>r.date===today) : db.purchaseReturns.filter(r=>r.date.startsWith(month));

  const salesTotal = sales.reduce((a,s)=>a+s.totalAmount,0);
  const salesGst = sales.reduce((a,s)=>a+s.totalGst,0);
  const purchaseTaxable = purchases.reduce((a,p)=>a+(p.totalAmount||0),0);
  const purchaseGst = purchases.reduce((a,p)=>a+(p.totalGst||0),0);
  const purchaseTotal = purchaseTaxable + purchaseGst;
  const saleReturnTotal = saleReturns.reduce((a,r)=>a+(r.totalAmount||0),0);
  const purchaseReturnTotal = purchaseReturns.reduce((a,r)=>a+(r.totalAmount||0)+(r.totalGst||0),0);
  const netSales = salesTotal - saleReturnTotal;

  return `
    <div class="segment">
      <button class="${reportMode==='daily'?'active':''}" onclick="reportMode='daily';render()">Daily</button>
      <button class="${reportMode==='monthly'?'active':''}" onclick="reportMode='monthly';render()">Monthly</button>
    </div>
    ${reportMode==='monthly' ? `<div class="field"><label>Month</label><input type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"/></div>` : ''}
    <div class="stat-grid">
      <div class="stat"><div class="num">${fmt(salesTotal)}</div><div class="lbl">Sale (incl. GST)</div></div>
      <div class="stat"><div class="num">${fmt(purchaseTotal)}</div><div class="lbl">Purchase (net, incl. GST)</div></div>
      <div class="stat"><div class="num">${fmt(netSales)}</div><div class="lbl">Net sale</div></div>

function renderPrintPreview(){
  if(!printDoc) return `<div class="empty">Nothing to show.</div>`;
  const { type, id } = printDoc;
  let record, docTitle, refLine, itemsRows, totalAmount, totalGst, backScreen;

  if(type==='purchaseReturn'){
    record = db.purchaseReturns.find(r=>r.id===id);
    docTitle = 'Purchase Return / Debit Note';
    refLine = `Issued to: distributor (see item batch for supplier reference)`;
    backScreen = 'stock';
  } else if(type==='saleReturn'){
    record = db.saleReturns.find(r=>r.id===id);
    docTitle = 'Sale Return / Credit Note';
    refLine = `Against original bill: ${record ? record.refSaleId : ''}`;
    backScreen = 'stock';
  } else if(type==='sale'){
    record = db.sales.find(s=>s.id===id);
    docTitle = 'Sale Bill';
    refLine = `Customer: ${record ? record.customer : ''}`;
    backScreen = 'reports';
  } else if(type==='purchase'){
    record = db.purchases.find(p=>p.id===id);
    docTitle = 'Purchase Bill';
    refLine = `Supplier: ${record ? record.supplier : ''}`;
    backScreen = 'reports';
  }

  if(!record) return `<div class="empty">Document not found.</div><button class="btn btn-ghost no-print" onclick="closePrintPreview('${backScreen||'reports'}')">← Back</button>`;

  const items = record.items || [];
  totalAmount = record.totalAmount || 0;
  totalGst = record.totalGst || 0;
  const inclusive = (type==='sale' || type==='saleReturn'); // MRP-based docs already include GST
  const taxableValue = inclusive ? (totalAmount-totalGst) : totalAmount;
  const grandTotal = inclusive ? totalAmount : (totalAmount+totalGst);

  itemsRows = items.map(it=>{
    const qty = it.qty!=null ? it.qty : '';
    const rate = it.rate!=null ? it.rate : 0;

  return `

      <div class="card">
        <div class="doc-head">
          <div class="shop">${(db.shopInfo&&db.shopInfo.name)||'Hussain Drug House'}</div>
          <div class="addr">Retail Pharmacy${(db.shopInfo&&db.shopInfo.gstin)?' • GSTIN: '+db.shopInfo.gstin:''}</div>
          ${(db.shopInfo&&db.shopInfo.dlNo)?`<div class="addr">D.L. No: ${db.shopInfo.dlNo}</div>`:''}
          <div class="addr">${(db.shopInfo&&db.shopInfo.address)||''}${(db.shopInfo&&db.shopInfo.phone)?' • '+db.shopInfo.phone:''}</div>
          <div class="doctitle">${docTitle}</div>
        </div>
        <div class="doc-meta">
          <span>Doc no: <b style="color:var(--ink-900);">${record.billNo||record.id}</b></span>
          <span>Date: <b style="color:var(--ink-900);">${record.date}</b></span>
        </div>
        <div class="step" style="margin-bottom:10px;">${refLine}</div>
        <table class="doc-table">
          <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">GST</th><th class="num">Amount</th></tr></thead>
          <tbody>${itemsRows}</tbody>
        </table>
        <div class="total-line"><span>Taxable value</span><span>${fmt(taxableValue)}</span></div>
        <div class="total-line"><span>GST${inclusive?' (included above)':''}</span><span>${fmt(totalGst)}</span></div>
        <div class="total-line grand"><span>Total</span><span>${fmt(grandTotal)}</span></div>

      </div>
    </div>

      <button class="btn btn-ghost" onclick="closePrintPreview('${backScreen}')">← Back</button>
      <button class="btn btn-primary" onclick="printNow()">🖨 Print / Save as PDF</button>
    </div>
    ${(type==='purchase'||type==='sale') ? `

      <button class="btn btn-ghost" onclick="openEditBill('${type}','${id}')">✏️ Edit this bill</button>
    </div>` : ''}

}

/* Balance owed: for a supplier, positive = you owe them. For a customer,
   positive = they owe you. */
function partyBalance(partyId){
  const party = db.parties.find(p=>p.id===partyId);
  if(!party) return 0;
  let bal = Number(party.openingBalance)||0;
  if(party.type==='supplier'){
    db.purchases.filter(p=>p.partyId===partyId).forEach(p=>{
      const total = (p.totalAmount||0)+(p.totalGst||0);
      bal += total - (p.amountPaid!=null ? p.amountPaid : total);
    });
  } else {
    db.sales.filter(s=>s.partyId===partyId).forEach(s=>{
      const total = s.totalAmount||0;
      bal += total - (s.amountPaid!=null ? s.amountPaid : total);
    });
  }
  db.payments.filter(pay=>pay.partyId===partyId).forEach(pay=>{ bal -= Number(pay.amount)||0; });
  return bal;
}
function totalToPay(){
  return db.parties.filter(p=>p.type==='supplier').reduce((a,p)=>a+Math.max(0,partyBalance(p.id)),0);
}
function totalToCollect(){
  return db.parties.filter(p=>p.type==='customer').reduce((a,p)=>a+Math.max(0,partyBalance(p.id)),0);
}
function stockValue(){
  return db.stock.reduce((a,s)=>a+(Number(s.qty)||0)*(Number(s.purchaseRate)||0),0);
}
function thisWeekSales(){
  const now = new Date();
  const weekAgo = new Date(now.getTime()-7*24*60*60*1000);
  return db.sales.filter(s=>new Date(s.date) >= weekAgo).reduce((a,s)=>a+s.totalAmount,0);
}

/* Full edit: existing items' qty/rate/batch/expiry/GST can all be changed,
   items can be removed, new items added, and the party/customer link fixed.

   then reapplying exactly what the EDITED bill does — so stock stays
   accurate no matter how much changes. */
let editBillContext = null;

function openEditBill(type, id){
  const record = type==='purchase' ? db.purchases.find(p=>p.id===id) : db.sales.find(s=>s.id===id);

  editBillContext = {
    type, id,
    partyId: record.partyId||null,
    items: JSON.parse(JSON.stringify(record.items||[])),        // editable working copy
    originalItems: JSON.parse(JSON.stringify(record.items||[])) // pristine copy, used to reverse old stock impact
  };
  currentScreen = 'editBill';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screenTitle').textContent = titles.editBill[0];
  document.getElementById('screenNote').textContent = titles.editBill[1];
  render();
}
function closeEditBill(){
  const ctx = editBillContext;
  editBillContext = null;
  if(ctx) openPrintPreview(ctx.type, ctx.id);
  else setScreen('dashboard');
}
window.openEditBill = openEditBill;
window.closeEditBill = closeEditBill;

        </div>
        <div class="field" style="margin-top:8px;"><label>Rate (MRP, incl. GST)</label><input type="number" value="${it.rate||''}" placeholder="0" onchange="updateEditItem(${idx},'rate',this.value)"/></div>
        <div class="field"><label>GST %</label>
          <select onchange="updateEditItem(${idx},'gst',this.value)">
            ${[0,5,12,18,28].map(g=>`<option value="${g}" ${Number(it.gst)===g?'selected':''}>${g}%</option>`).join('')}
          </select>
        </div>
      </div>`;
    }
  }).join('');

  return `
    <button class="btn btn-ghost no-print" style="margin-bottom:10px;" onclick="closeEditBill()">← Back to bill</button>
    <div class="card">
      <h3>Fix ${isPurchase?'supplier':'customer'} link</h3>
      <div class="field"><label>${isPurchase?'Supplier':'Customer'}</label>
        <select onchange="editBillContext.partyId=this.value||null;">
          <option value="">Not linked to a ledger</option>
          ${partyOptions.map(p=>`<option value="${p.id}" ${editBillContext.partyId===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="card">
      <h3>Items on this bill</h3>
      ${itemsHtml || `<div class="empty">No items — add at least one below.</div>`}
      <div class="step" style="margin-top:8px;">Editing quantity/rate here corrects stock automatically — the original amounts are undone and the new ones applied, so stock stays accurate.</div>
    </div>
    <div class="card">
      <h3>Add another item</h3>
      ${isPurchase
        ? `<button class="btn btn-ghost" onclick="addEditItemBlank()">+ Add item row</button>`
        : `<div class="field"><label>Search stock item</label><input id="editSaleSearch" placeholder="Type item name..." oninput="renderEditSaleSearch(this.value)"/></div><div id="editSaleSearchResults"></div>`
      }
    </div>
    <button class="btn btn-primary" onclick="saveEditBill()">Save changes</button>
  `;
}

function saveEditBill(){
  if(CLOUD_MODE){ saveEditBillCloud(); return; }
  const { type, id, partyId, items, originalItems } = editBillContext;

  if(type==='purchase'){
    const rec = db.purchases.find(p=>p.id===id);
    if(!rec) return;
    const valid = items.filter(it=>it.itemName.trim() && it.batch.trim() && Number(it.qty)>0);
    if(!valid.length){ alert('A purchase needs at least one item.'); return; }

    // Reverse exactly what the original bill added to stock.
    originalItems.forEach(it=>{
      const s = findStock(it.itemName, it.batch);
      if(s) s.qty -= (Number(it.qty)+Number(it.freeQty||0));
    });
    // Reapply exactly what the edited bill should add.
    let totalAmount=0, totalGst=0;
    valid.forEach(it=>{
      const amt = Number(it.qty)*Number(it.rate);
      totalAmount += amt; totalGst += amt*Number(it.gst)/100;
      let s = findStock(it.itemName, it.batch);
      const typedMrp = Number(it.mrp)>0 ? Number(it.mrp) : Number(it.rate)*1.2;
      if(!s){
        s = {id: slugId(it.itemName, it.batch), itemName:it.itemName.trim(), batch:it.batch.trim(), expiry:it.expiry, mrp:typedMrp, purchaseRate:Number(it.rate), gst:Number(it.gst), qty:0};
        db.stock.push(s);
      }
      s.qty += Number(it.qty)+Number(it.freeQty||0);
      s.purchaseRate = Number(it.rate);
      s.mrp = typedMrp;
      if(it.expiry) s.expiry = it.expiry;
    });
    rec.items = valid;
    rec.totalAmount = totalAmount;
    rec.totalGst = totalGst;
    rec.partyId = partyId||null;
    saveDB(db);

  } else {
    const rec = db.sales.find(s=>s.id===id);
    if(!rec) return;
    const valid = items.filter(it=>Number(it.qty)>0);
    if(!valid.length){ alert('A sale needs at least one item.'); return; }

    // Reverse exactly what the original sale took out of stock.
    originalItems.forEach(it=>{
      const s = db.stock.find(x=>x.id===it.stockId);
      if(s) s.qty += (Number(it.qty)+Number(it.freeQty||0));
    });
    // Check the edited quantities are actually available before committing.
    for(const it of valid){
      const s = db.stock.find(x=>x.id===it.stockId);
      const needed = Number(it.qty)+Number(it.freeQty||0);
      if(!s || s.qty < needed){
        // undo the reversal above so nothing is left half-changed
        originalItems.forEach(it2=>{
          const s2 = db.stock.find(x=>x.id===it2.stockId);
          if(s2) s2.qty -= (Number(it2.qty)+Number(it2.freeQty||0));
        });
        alert(`Not enough stock for ${it.itemName}. Available: ${s?s.qty:0}`);
        return;
      }
    }
    let totalAmount=0, totalGst=0, totalDiscount=0;
    valid.forEach(it=>{
      const gross = Number(it.qty)*Number(it.rate);
      const disc = gross*Number(it.discount||0)/100;
      const net = gross-disc;
      const taxable = net/(1+Number(it.gst)/100);
      totalAmount += net; totalGst += (net-taxable); totalDiscount += disc;
      const s = db.stock.find(x=>x.id===it.stockId);
      s.qty -= (Number(it.qty)+Number(it.freeQty||0));
    });
    rec.items = valid;
    rec.totalAmount = totalAmount;
    rec.totalGst = totalGst;
    rec.totalDiscount = totalDiscount;
    rec.partyId = partyId||null;
    saveDB(db);
  }

  const ctx = editBillContext;
  editBillContext = null;
  openPrintPreview(ctx.type, ctx.id);
}

async function saveEditBillCloud(){
  const { type, id, partyId, items, originalItems } = editBillContext;
  try{
    if(type==='purchase'){
      const valid = items.filter(it=>it.itemName.trim() && it.batch.trim() && Number(it.qty)>0);
      if(!valid.length){ alert('A purchase needs at least one item.'); return; }

      // Net stock delta per item+batch: reverse the original, then apply the edited version.
      const deltas = {};
      originalItems.forEach(it=>{
        const key = slugId(it.itemName, it.batch);
        deltas[key] = (deltas[key]||0) - (Number(it.qty)+Number(it.freeQty||0));
      });
      let totalAmount=0, totalGst=0;
      const patches = {};
      valid.forEach(it=>{
        const key = slugId(it.itemName, it.batch);
        deltas[key] = (deltas[key]||0) + (Number(it.qty)+Number(it.freeQty||0));
        patches[key] = {
          itemName: it.itemName.trim(), batch: it.batch.trim(),
          purchaseRate: Number(it.rate), gst: Number(it.gst),
          mrp: Number(it.mrp)>0 ? Number(it.mrp) : Number(it.rate)*1.2
        };
        if(it.expiry) patches[key].expiry = it.expiry;
        const amt = Number(it.qty)*Number(it.rate);
        totalAmount += amt; totalGst += amt*Number(it.gst)/100;
      });
      const batchWrite = fsDB.batch();
      Object.keys(deltas).forEach(key=>{
        const stockRef = fsDB.collection('stock').doc(key);
        const patch = Object.assign({}, patches[key]||{}, {qty: firebase.firestore.FieldValue.increment(deltas[key])});
        batchWrite.set(stockRef, patch, {merge:true});
      });
      batchWrite.update(fsDB.collection('purchases').doc(id), {
        items: valid, totalAmount, totalGst, partyId: partyId||null
      });
      await batchWrite.commit();

    } else {
      const valid = items.filter(it=>Number(it.qty)>0);
      if(!valid.length){ alert('A sale needs at least one item.'); return; }

      // Net stock delta per stockId: give back the original, take the edited version.
      const deltas = {};
      originalItems.forEach(it=>{
        deltas[it.stockId] = (deltas[it.stockId]||0) + (Number(it.qty)+Number(it.freeQty||0));
      });
      valid.forEach(it=>{
        deltas[it.stockId] = (deltas[it.stockId]||0) - (Number(it.qty)+Number(it.freeQty||0));
      });
      const saleRef = fsDB.collection('sales').doc(id);
      await fsDB.runTransaction(async (tx)=>{
        const keys = Object.keys(deltas);
        const refs = keys.map(k=>fsDB.collection('stock').doc(k));
        const snaps = await Promise.all(refs.map(r=>tx.get(r)));
        snaps.forEach((snap,i)=>{
          const current = snap.exists ? (snap.data().qty||0) : 0;
          if(current + deltas[keys[i]] < 0) throw new Error('Not enough stock available to apply this change.');
        });
        snaps.forEach((snap,i)=>{
          tx.update(refs[i], {qty: firebase.firestore.FieldValue.increment(deltas[keys[i]])});
        });
        let totalAmount=0, totalGst=0, totalDiscount=0;
        valid.forEach(it=>{
          const gross = Number(it.qty)*Number(it.rate);
          const disc = gross*Number(it.discount||0)/100;
          const net = gross-disc;
          const taxable = net/(1+Number(it.gst)/100);
          totalAmount += net; totalGst += (net-taxable); totalDiscount += disc;
        });
        tx.update(saleRef, {items: valid, totalAmount, totalGst, totalDiscount, partyId: partyId||null});
      });
    }
    const ctx = editBillContext;
    editBillContext = null;
    openPrintPreview(ctx.type, ctx.id);
  }catch(e){
    console.error(e);
    alert('Could not save changes: '+e.message);
  }
}

/* Resize + re-compress a photo before it's stored/uploaded, so a 2-3MB
   phone photo typically shrinks to well under 300KB while staying readable. */
function compressImage(dataURL, maxWidth, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxWidth){
        h = Math.round(h * (maxWidth / w));
        w = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> resolve(dataURL); // fall back to original if anything goes wrong
    img.src = dataURL;
  });
}

/* Cloud mode without a Storage bucket (Option B): the bill photo is stored
   directly inside the Firestore purchase document instead of a separate
   file bucket. Firestore caps a single document at 1MB total, so this
   keeps re-compressing (smaller width, lower quality) until the photo
   comfortably fits, leaving room for the rest of the document's fields. */
async function ensureFirestoreSafePhoto(dataURL){
  let current = dataURL;
  let width = 1600, quality = 0.7;
  for(let i=0;i<5;i++){
    const approxBytes = Math.ceil((current.length * 3) / 4);
    if(approxBytes < 650*1024) return current;
    width = Math.round(width*0.8);
    quality = Math.max(0.35, quality-0.15);
    current = await compressImage(dataURL, width, quality);
  }
  return current;
}

/* ===================== ITEM PICKER (reuse existing stock items) =====================
   Instead of retyping a product's name/rate/GST every time you buy or sell
   the same thing again, browse or search everything already in stock and
   tap Add. For Purchase this pre-fills name/rate/MRP/GST from the last time
   you bought it — batch, expiry and quantity are always left for you to
   enter fresh, since those genuinely change bill to bill. */
let itemPickerContext = 'purchase'; // 'purchase' or 'sale' (sale has its own inline picker already; kept here for future reuse)

function getUniqueStockItems(){
  const seen = {};
  const list = [];
  db.stock.forEach(s=>{
    const key = s.itemName.trim().toLowerCase();
    if(!seen[key]){ seen[key] = true; list.push(s); }
  });
  return list.sort((a,b)=>a.itemName.localeCompare(b.itemName));
}

function openItemPicker(context){
  itemPickerContext = context;
  document.getElementById('itemPickerSearch').value = '';

}

}
function renderItemPickerList(query){
  const box = document.getElementById('itemPickerList');
  const all = getUniqueStockItems();
  const q = (query||'').trim().toLowerCase();
  const matches = q ? all.filter(s=>s.itemName.toLowerCase().includes(q)) : all;
  let html = `<div class="list-row" style="cursor:pointer;" onclick="closeItemPicker();addPurchaseItem();">
      <div class="li-main" style="color:var(--teal-700);">+ Create new product not listed here</div>
    </div>`;
  if(!matches.length){
    html += `<div class="empty" style="padding:20px 0;">No matching products in stock yet — use "Create new product" above.</div>`;
  } else {
    html += matches.map(s=>{
      const safeName = s.itemName.replace(/'/g,"\\'");
      const activeIdx = purchaseDraft.items.findIndex(it=>it.itemName===s.itemName && it.batch==='' && it.fromPicker);
      const qtyInCart = activeIdx>-1 ? Number(purchaseDraft.items[activeIdx].qty)||0 : 0;
      const control = qtyInCart>0
        ? `<div style="display:flex;align-items:center;gap:8px;">
             <button class="chip" style="padding:6px 12px;" onclick="stepPickerQty('${safeName}',-1)">−</button>
             <span style="min-width:18px;text-align:center;font-weight:700;">${qtyInCart}</span>
             <button class="chip" style="padding:6px 12px;" onclick="stepPickerQty('${safeName}',1)">+</button>
           </div>`
        : `<button class="btn btn-primary btn-sm" onclick="addFromPicker('${safeName}', '${s.mrp}', '${s.purchaseRate}', '${s.gst}')">Add +</button>`;
      return `
      <div class="list-row">
        <div><div class="li-main">${s.itemName}</div><div class="li-sub">Last MRP ${fmt(s.mrp)} • Last cost ${fmt(s.purchaseRate)} • GST ${s.gst}%</div></div>
        ${control}
      </div>`;
    }).join('');
  }
  box.innerHTML = html;
}
function addFromPicker(itemName, mrp, rate, gst){
  purchaseDraft.items.push({
    itemName: itemName, batch:'', expiry:'', qty:1, freeQty:0,
    rate: Number(rate)||0, mrp: Number(mrp)||0, gst: Number(gst)||5, detected:null, fromPicker:true
  });

function stepPickerQty(itemName, delta){
  const idx = purchaseDraft.items.findIndex(it=>it.itemName===itemName && it.batch==='' && it.fromPicker);
  if(idx===-1) return;
  purchaseDraft.items[idx].qty = (Number(purchaseDraft.items[idx].qty)||0) + delta;
  if(purchaseDraft.items[idx].qty<=0){ purchaseDraft.items.splice(idx,1); }

}

function renderOcrPanel(){
  const key = getOcrKey();
  if(!key){
    return `<div class="step" style="margin:10px 0;">Want to auto-read the text off this photo instead of re-reading the small print? <span style="color:var(--teal-700);font-weight:700;cursor:pointer;" onclick="openOcrModal()">Connect OCR (optional)</span></div>`;

  </div>

async function extractTextFromPhoto(){
  const key = getOcrKey();
  if(!key || !purchaseDraft.photo) return;
  ocrBusy = true; render();
  try{
    const base64 = purchaseDraft.photo.split(',')[1];
    const resp = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${key}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ requests:[{ image:{content:base64}, features:[{type:'TEXT_DETECTION'}] }] })
    });
    const data = await resp.json();
    if(data.error){ throw new Error(data.error.message || 'Vision API error'); }
    const text = data.responses && data.responses[0] && data.responses[0].fullTextAnnotation
      ? data.responses[0].fullTextAnnotation.text : '';
    const noise = /^(drug lic|food lic|d\.?l\.?\s*no|gst invoice|credit|inv\s*no|billed by|ph\s*:|state\s*:|date\s*:|for\s|e\.?\s*&\s*o\.?\s*e|rs\.?\s*five|total|ledger|goods total|other misc|item discount|scheme disc|bill disc|cgst payable|sgst payable|description|pack$|batch$|qty\+?fre)/i;
    ocrLines = text.split('\n').map(l=>l.trim())
      .filter(l=>l.length>1 && !noise.test(l))
      .map(l=>l.replace(/^\d{1,3}\s+(?=[A-Za-z])/, ''));
    if(!ocrLines.length) alert('No readable text found in this photo — try a clearer, well-lit shot.');
  }catch(e){
    console.error(e);
    alert('Could not read the photo: '+e.message+'\n\nCheck that Cloud Vision API is enabled and billing is linked for your project.');
  }
  ocrBusy = false; render();
}

/* Beta: reconstructs table rows using each word's position on the photo
   (not just plain flat text), so columns like Qty+Free, Expiry, MRP and
   Rate can be told apart. Tuned for a MARG ERP-style purchase bill layout.
   Anything not confidently matched is left blank on purpose. */
async function extractTableFromPhoto(){
  const key = getOcrKey();
  if(!key || !purchaseDraft.photo) return;
  ocrBusy = true; render();
  try{
    const base64 = purchaseDraft.photo.split(',')[1];
    const resp = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${key}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ requests:[{ image:{content:base64}, features:[{type:'TEXT_DETECTION'}] }] })
    });
    const data = await resp.json();
    if(data.error){ throw new Error(data.error.message || 'Vision API error'); }
    const text = data.responses && data.responses[0] && data.responses[0].fullTextAnnotation
      ? data.responses[0].fullTextAnnotation.text : '';
    if(!text){ alert('No readable text found — try a clearer, well-lit, flatter photo.'); ocrBusy=false; render(); return; }

    const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>1);
    const parsed = [];
    lines.forEach(rawLine=>{
      // Strip a leading serial number column, e.g. "1 DNS SALINE (AXA)" -> "DNS SALINE (AXA)"
      const line = rawLine.replace(/^\d{1,3}\s+(?=[A-Za-z])/, '');
      const qtyFreeMatch = line.match(/(\d{1,4})\s*\+\s*(\d{1,3})/);
      const expiryMatch = line.match(/\b(\d{1,2})\/(\d{2,4})\b/);
      const decimals = (line.match(/\d+\.\d{2}\b/g) || []);
      // A product line: starts with letters, and has either a qty+free pattern
      // or at least two decimal numbers (MRP, Rate) somewhere in it.
      const descMatch = line.match(/^([A-Za-z][A-Za-z0-9\-\.\s\(\)]{2,45}?)(?=\s+[\d(])/) || line.match(/^([A-Za-z][A-Za-z0-9\-\.\s\(\)]{2,45})$/);
      if(!descMatch) return;
      if(!qtyFreeMatch && decimals.length<2) return;
      const description = descMatch[1].trim();
      if(description.length<3) return;
      let expiry = '';
      if(expiryMatch){
        const mm = expiryMatch[1].padStart(2,'0');
        let yy = expiryMatch[2];
        if(yy.length>2) yy = yy.slice(-2); // keep last 2 digits — field format is MM/YY
        expiry = mm+'/'+yy;
      }
      parsed.push({
        itemName: description,
        batch: '',
        expiry: expiry,
        qty: qtyFreeMatch ? Number(qtyFreeMatch[1]) : 0,
        freeQty: qtyFreeMatch ? Number(qtyFreeMatch[2]) : 0,
        mrp: decimals.length>=2 ? Number(decimals[decimals.length-2]) : 0,
        rate: decimals.length>=1 ? Number(decimals[decimals.length-1]) : 0,
        gst: 12,
        detected: 'auto-parsed — verify against the bill',
        guessed: true
      });
    });

    if(!parsed.length){
      alert('Couldn\'t confidently detect item rows in this photo. Try "Read text (tap lines)" instead, or add items manually.');
    } else {
      parsed.forEach(p=> purchaseDraft.items.push(p));
    }
  }catch(e){
    console.error(e);
    alert('Could not read the bill table: '+e.message+'\n\nCheck that Cloud Vision API is enabled and billing is linked for your project.');
  }
  ocrBusy = false; render();
}

function addOcrLineAsItem(i){
  const raw = ocrLines[i];
  if(!raw) return;
  // Strip a leading serial number column, e.g. "1 DNS SALINE (AXA)" -> "DNS SALINE (AXA)"
  const line = raw.replace(/^\d{1,3}\s+(?=[A-Za-z])/, '');
  purchaseDraft.items.push({itemName:line, batch:'', expiry:'', qty:0, freeQty:0, rate:0, mrp:0, gst:5, detected:'from photo text'});
  render();
}

/* One-time repair: older versions of this app could assign the same ID to
   two different products (a numbering bug). This rebuilds every stock ID
   from its item name + batch (which can never collide), merges any rows
   that turn out to be true duplicates, and fixes historical sale/return
   records to point at the corrected IDs. Safe to run every load. */
function repairStockIds(){
  const merged = {};
  db.stock.forEach(s=>{
    const newId = slugId(s.itemName, s.batch);
    if(merged[newId]){
      merged[newId].qty = (merged[newId].qty||0) + (s.qty||0);
      merged[newId].purchaseRate = s.purchaseRate;
      merged[newId].mrp = s.mrp;
      merged[newId].gst = s.gst;
      if(s.expiry) merged[newId].expiry = s.expiry;
    } else {
      merged[newId] = Object.assign({}, s, {id:newId});
    }
  });
  db.stock = Object.values(merged);
  const fixRefs = (arr)=>{ (arr||[]).forEach(rec=>{
    (rec.items||[]).forEach(it=>{ if(it.itemName && it.batch) it.stockId = slugId(it.itemName, it.batch); });
  }); };
  fixRefs(db.sales); fixRefs(db.saleReturns); fixRefs(db.purchaseReturns);
  saveDB(db);
}

    db.stock.push({id:slugId('Amoxicillin 250mg','AX0987'), itemName:'Amoxicillin 250mg', batch:'AX0987', expiry:'03/2026', mrp:45, purchaseRate:32, gst:12, qty:8});
    saveDB(db);
  } else {

}
